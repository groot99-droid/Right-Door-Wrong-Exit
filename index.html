<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RIGHT DOOR, WRONG EXIT</title>
<meta name="description" content="A looping liminal-space walkthrough: seven rooms, seven loading screens, no exit." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='9' y='5' width='14' height='22' fill='none' stroke='%23ffb703' stroke-width='2'/%3E%3Ccircle cx='19' cy='16' r='1.6' fill='%23ffb703'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body class="phase-home">

<button class="sound-toggle" id="soundToggle" aria-pressed="true" type="button">
  <span class="dot"></span>
  <span class="label">SOUND ON</span>
</button>

<button class="notes-tab-handle" id="notesHandle" type="button">LOG</button>

<button class="skip-tab-handle" id="skipBtn" type="button">SKIP</button>

<aside class="notes-panel" aria-live="polite">
  <div class="notes-title" id="notesTitle">Log entry</div>
  <div class="notes-tag" id="notesTag">--:--</div>
  <div class="notes-body" id="notesBody"></div>
</aside>

<audio id="sectionAudio" loop preload="auto"></audio>

<div class="gate" id="gate">
  <div class="gate-text">CLICK ANYWHERE TO BEGIN</div>
</div>

<main class="stage" id="stage">

  <!-- ============ HOME ============ -->
  <section class="screen screen-home is-active" id="screenHome">
    <img class="home-bg" src="0.PNG" alt="" />
    <div class="home-inner">
      <button class="start-btn" id="startBtn" type="button">
        <span class="start-btn-label">START</span>
      </button>
    </div>
  </section>

  <!-- ============ LOADING ============ -->
  <section class="screen screen-load" id="screenLoad" aria-hidden="true">
    <video id="loadVideo" muted playsinline preload="auto"></video>
  </section>

  <!-- ============ SCENE ============ -->
  <section class="screen screen-scene" id="screenScene" aria-hidden="true">
    <video id="sceneVideo" muted loop playsinline preload="auto"></video>
    <div class="reel-header">
      <div class="reel-title-top" id="sceneTitleTop"></div>
      <div class="reel-title-bottom" id="sceneTitleBottom"></div>
    </div>
    <div class="center-card" id="captionCard">
      <span class="typed-text" id="typedText"></span><span class="cursor"></span>
    </div>
    <button class="next-btn" id="nextBtn" type="button" hidden>
      <span class="next-label" id="nextLabel">NEXT</span>
      <span class="next-arrow" id="nextArrow">&rarr;</span>
    </button>
  </section>

  <!-- ============ WALK (3D) ============ -->
  <section class="screen screen-walk" id="screenWalk" aria-hidden="true">
    <div class="walk-mount" id="walkMount"></div>
    <div class="walk-objective" id="walkObjective"></div>
    <div class="walk-hint" id="walkHint"></div>
    <div class="walk-joystick" id="walkJoystick" aria-hidden="true"><div class="knob"></div></div>
    <div class="walk-fade" id="walkFade"></div>
  </section>

  <div class="glitch-veil" id="glitchVeil" aria-hidden="true">
    <div class="glitch-bars"></div>
    <div class="glitch-noise"></div>
    <div class="glitch-rgb"></div>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
