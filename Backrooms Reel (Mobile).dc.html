<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: fallback; src: local(Arial); }
    body { margin: 0; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tubeFlicker { 0%, 96%, 100% { opacity: 1; filter: brightness(1); } 97% { opacity: 0.35; filter: brightness(1.9); } 98.5% { opacity: 0.9; filter: brightness(0.8); } }
    @keyframes letterBurst { 0% { opacity: 1; } 8% { opacity: 0.1; } 16% { opacity: 1; } 26% { opacity: 0.15; } 40% { opacity: 1; } 55% { opacity: 0.3; } 100% { opacity: 1; } }
    .reel-scroll { scroll-snap-type: y mandatory; overflow-y: scroll; overflow-x: hidden; scroll-behavior: smooth; }
    .reel-scroll::-webkit-scrollbar { width: 0; }

  </style>
</helmet>
<div class="reel-scroll" style="height:100vh;background:#000;position:relative" ref="{{ scrollRef }}" onScroll="{{ onScroll }}">

  <button type="button" style="position:fixed;top:3vh;left:3vh;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,183,3,0.5);border-radius:999px;padding:8px 14px;font-family:'Share Tech Mono','Courier New',monospace;font-size:0.7rem;letter-spacing:0.15em;color:#ffb703;cursor:pointer;backdrop-filter:blur(6px);user-select:none" onClick="{{ toggleSound }}" aria-pressed="{{ soundOnStr }}">
    <span style="width:7px;height:7px;border-radius:50%;display:block;transition:background 0.25s ease, box-shadow 0.25s ease;background:{{ dotColor }};box-shadow:{{ dotShadow }}"></span>
    <span>{{ soundLabel }}</span>
  </button>

  <div style="position:fixed;top:0;right:0;height:100vh;width:min(80vw, 340px);z-index:59;transform:translateX({{ tabTranslate }});transition:transform 0.45s cubic-bezier(0.22,1,0.36,1)">
    <button type="button" onClick="{{ toggleTab }}" style="position:absolute;left:-46px;top:calc(50% - 65px);width:46px;height:130px;clip-path:polygon(0% 12%, 100% 0%, 100% 100%, 0% 88%);background:linear-gradient(135deg, #e0b23a, #c99420);border:1px solid rgba(0,0,0,0.25);border-right:none;color:#3a2a08;font-family:'Papyrus','Copperplate',fantasy;font-weight:700;font-size:0.7rem;letter-spacing:0.1em;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:-2px 2px 6px rgba(0,0,0,0.35)">NOTES</button>

    <div style="position:absolute;inset:0;background:linear-gradient(to right, transparent 30px, rgba(110,105,95,0.3) 30px, rgba(110,105,95,0.3) 32px, transparent 32px), repeating-linear-gradient(to bottom, transparent 0px, transparent 26px, rgba(110,110,110,0.22) 26px, rgba(110,110,110,0.22) 27px), #ece9df;border-left:1px solid rgba(0,0,0,0.15);overflow-y:auto;padding:9vh 1.4rem 3rem 2.4rem;box-shadow:-20px 0 60px rgba(0,0,0,0.5)">
      <div style="font-family:'Papyrus','Copperplate',fantasy;font-weight:700;color:#1b1b1b;font-size:1.25rem;margin-bottom:1rem">Field notes — {{ activeNote.title }}</div>
      <div style="font-family:'Papyrus','Copperplate',fantasy;color:#1b1b1b;font-size:0.75rem;letter-spacing:0.05em;margin-bottom:0.7rem;opacity:0.75">{{ activeNote.tag }}</div>
      <div style="font-family:'Papyrus','Copperplate',fantasy;color:#1b1b1b;font-size:0.9rem;line-height:1.6">{{ activeNote.body }}</div>
    </div>
  </div>

  <sc-for list="{{ reels }}" as="reel" hint-placeholder-count="7">
    <section data-label="{{ reel.titleBottom }}" data-comment-anchor="{{ reel.id }}" data-reel-section="" style="position:relative;width:100%;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:flex-start;justify-content:center">
      <div data-reel-bg="" style="position:absolute;inset:0;width:100%;height:100%;background:{{ reel.bg }};z-index:1;display:flex;align-items:center;justify-content:center;transform:scale(1.05);transition:transform 0.1s linear">
        <span style="font-family:'Share Tech Mono',monospace;color:rgba(255,183,3,0.35);font-size:0.75rem;letter-spacing:0.15em">VIDEO PLACEHOLDER — {{ reel.videoFile }}</span>
      </div>
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.05) 28%, rgba(0,0,0,0.05) 60%, rgba(0,0,0,0.4) 100%);z-index:2;pointer-events:none"></div>

      <div data-reel-head="" style="position:relative;z-index:3;margin-top:8vh;padding:0 6vw;text-align:center;transition:transform 0.1s linear, opacity 0.1s linear">
        <div style="font-family:'Oswald','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:0.04em;font-size:clamp(1.33rem, 4vw, 3rem);color:#ffb703;text-shadow:0 4px 14px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.95);line-height:1.1">{{ reel.titleTop }}</div>
        <div style="font-family:'Oswald','Arial Narrow',Impact,sans-serif;font-weight:700;letter-spacing:0.04em;font-size:clamp(2rem, 6vw, 4.5rem);color:#ffb703;text-shadow:0 4px 14px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.95);line-height:1.05">
          <sc-for list="{{ reel.letters }}" as="L" hint-placeholder-count="10"><span style="{{ L.style }}">{{ L.ch }}</span></sc-for>
        </div>
      </div>

      <div style="position:absolute;left:50%;top:45%;z-index:4;width:min(560px, 88vw);padding:24px 24px;background:rgba(247,242,228,0.95);clip-path:polygon(2% 4%, 20% 0%, 45% 3%, 70% 0%, 98% 5%, 100% 25%, 97% 50%, 100% 75%, 96% 97%, 75% 100%, 50% 97%, 25% 100%, 3% 96%, 0% 70%, 4% 45%, 0% 20%);box-shadow:0 12px 40px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.25);color:#1a1712;font-family:'American Typewriter','Courier New',Courier,monospace;font-size:clamp(0.95rem, 4vw, 1.1rem);line-height:1.6;pointer-events:none;transition:opacity 0.6s ease, transform 0.6s ease;opacity:{{ reel.visible }};transform:translate(-50%, -50%) rotate({{ reel.rot }}deg) scale({{ reel.scale }})">
        <span style="white-space:pre-wrap">{{ reel.typed }}</span><span style="display:inline-block;width:0.55ch;background:#1a1712;margin-left:2px;animation:blink 1s steps(1) infinite">&nbsp;</span>
      </div>
    </section>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    soundOn: false,
    typed: {},
    visible: {},
    activeId: null,
    tabOpen: false,
    letterHits: {}
  };

  notes = [
    { id: 'r1', tag: 'FN-01', title: 'THE WRONG DOOR', body: "The word comes from the Latin limen, \u201cthreshold.\u201d Anthropologists first used it for the middle stage of a rite of passage \u2014 the moment between what a person was and what they haven't become yet." },
    { id: 'r2', tag: 'FN-02', title: 'NON-PLACE', body: 'Anthropologist Marc Aug\u00e9 coined \u201cnon-place\u201d for spaces built only to be passed through: airports, motorway stops, hotel corridors. He argued no one is ever truly present in them, including the people who run them.' },
    { id: 'r3', tag: 'FN-03', title: 'THE HUM', body: 'Liminal-space photography became a genre online around 2019, built from ordinary interiors \u2014 empty malls, waiting rooms, motel hallways. The unease is structural, not supernatural: a space with no one in it reads as wrong.' },
    { id: 'r4', tag: 'FN-04', title: 'ETERNAL RECURRENCE', body: 'Victor Turner extended the concept in the 1960s, describing liminality as a state rather than a stage \u2014 a condition some people, and some places, get stuck in, never completing the passage through.' },
    { id: 'r5', tag: 'FN-05', title: 'NO EXIT', body: 'The \u201cBackrooms\u201d myth began with a single uncredited photo in 2019: a yellow, fluorescent-lit room with no visible exit. It spread because the image needed no story attached to unsettle people.' },
    { id: 'r6', tag: 'FN-06', title: 'THE ONE WHO WAS JUST HERE', body: 'Liminal spaces unsettle partly because they show clear evidence of use \u2014 a chair, a cup, a coat \u2014 with no one present. The absence reads louder than the object does.' },
    { id: 'r7', tag: 'FN-07', title: 'UNCANNY VALLEY OF SPACE', body: 'Freud\u2019s \u201cuncanny\u201d describes something almost familiar. Liminal architecture applies the same effect to rooms: recognizable enough to expect normal use, wrong enough that the eye can\u2019t finish the match.' }
  ];

  data = [
    { id: 'r1', titleTop: 'Right Door', titleBottom: 'Wrong Exit', index: '01 / 07', text: "The door was already open when you got here. You don't remember opening it. You don't remember arriving, either.", videoFile: 'reel-01.mp4', bg: 'radial-gradient(circle at 50% 40%, #3a3226, #0c0a08 70%)', rot: -1.4 },
    { id: 'r2', titleTop: 'No Space Like A', titleBottom: 'Non-Place', index: '02 / 07', text: 'This hallway has no name and never earned one. It exists only to be passed through. No one has ever arrived here on purpose.', videoFile: 'reel-02.mp4', bg: 'radial-gradient(circle at 50% 40%, #332e1f, #0a0906 70%)', rot: 1.1 },
    { id: 'r3', titleTop: 'The Sound of liminality', titleBottom: 'florescent bulbs', index: '03 / 07', text: "The hum was already running when the building was built. It doesn't come from anywhere. It doesn't stop.", videoFile: 'reel-03.mp4', bg: 'radial-gradient(circle at 50% 40%, #2e2a22, #090806 70%)', rot: -0.8 },
    { id: 'r4', titleTop: 'Eternal Recurrence', titleBottom: 'Just Keep Moving', index: '04 / 07', text: 'You have stood in this exact spot before. The carpet remembers your weight. You will stand here again.', videoFile: 'reel-04.mp4', bg: 'radial-gradient(circle at 50% 40%, #362f20, #0b0a07 70%)', rot: 1.6 },
    { id: 'r5', titleTop: "There's No Exit", titleBottom: 'In The Backrooms', index: '05 / 07', text: 'The exit sign burned out sometime before you got here. No one has replaced it. No one intends to.', videoFile: 'reel-05.mp4', bg: 'radial-gradient(circle at 50% 40%, #302a1e, #0a0907 70%)', rot: -1.2 },
    { id: 'r6', titleTop: 'You Just Missed Them', titleBottom: 'Someone Was Here', index: '06 / 07', text: "Someone was sitting in that chair. It's still warm. They left in a hurry, or they didn't leave at all.", videoFile: 'reel-06.mp4', bg: 'radial-gradient(circle at 50% 40%, #342e21, #0a0907 70%)', rot: 0.9 },
    { id: 'r7', titleTop: 'Where spaces meet', titleBottom: 'The Uncanny Valley', index: '07 / 07', text: 'This room knows what a room should look like. It got most of it right. The parts it got wrong are the parts that matter.', videoFile: 'reel-07.mp4', bg: 'radial-gradient(circle at 50% 40%, #383021, #0b0a07 70%)', rot: -1.7 }
  ];

  scrollRef = React.createRef();
  timers = {};
  letterMeta = {};

  componentDidMount() {
    this.data.forEach((d) => {
      this.letterMeta[d.id] = d.titleBottom.split('').map(() => ({ delay: Math.random() * 6, dur: 5 + Math.random() * 3 }));
    });

    const el = this.scrollRef.current;
    if (!el) return;
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const id = entry.target.dataset.rid;
        if (entry.isIntersecting && entry.intersectionRatio >= 0.95) {
          this.startSection(id);
          this.setState({ activeId: id });
        } else {
          this.resetSection(id);
        }
      });
    }, { threshold: [0, 0.95, 1], root: el });
    Array.from(el.querySelectorAll('section')).forEach((sec, i) => {
      sec.dataset.rid = this.data[i].id;
      this.io.observe(sec);
    });

    let raf = null;
    this.onScrollParallax = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const vh = el.clientHeight;
        el.querySelectorAll('[data-reel-section]').forEach((sec) => {
          const rect = sec.getBoundingClientRect();
          const elRect = el.getBoundingClientRect();
          const centerOffset = (rect.top - elRect.top) / vh;
          const progress = Math.max(-1, Math.min(1, centerOffset));
          const bg = sec.querySelector('[data-reel-bg]');
          const head = sec.querySelector('[data-reel-head]');
          if (bg) bg.style.transform = `scale(${1.05 + Math.abs(progress) * 0.1}) translateY(${progress * 30}px)`;
          if (head) {
            head.style.transform = `translateY(${progress * 40}px)`;
            head.style.opacity = String(1 - Math.abs(progress) * 0.5);
          }
        });
      });
    };
    el.addEventListener('scroll', this.onScrollParallax, { passive: true });
    this.onScrollParallax();

    this.flickerInterval = setInterval(() => this.triggerFlicker(), 5000);
  }

  triggerFlicker() {
    const reel = this.data[Math.floor(Math.random() * this.data.length)];
    const len = reel.titleBottom.length;
    const hits = new Set();
    const count = 1 + Math.floor(Math.random() * 2);
    for (let n = 0; n < count; n++) hits.add(Math.floor(Math.random() * len));
    const keys = Array.from(hits).map((idx) => `${reel.id}-${idx}`);
    this.setState((s) => {
      const next = { ...s.letterHits };
      keys.forEach((k) => { next[k] = true; });
      return { letterHits: next };
    });
    setTimeout(() => {
      this.setState((s) => {
        const next = { ...s.letterHits };
        keys.forEach((k) => { delete next[k]; });
        return { letterHits: next };
      });
    }, 500);
  }

  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    if (this.flickerInterval) clearInterval(this.flickerInterval);
    if (this.scrollRef.current && this.onScrollParallax) this.scrollRef.current.removeEventListener('scroll', this.onScrollParallax);
    Object.values(this.timers).forEach((t) => { clearTimeout(t.type); clearTimeout(t.hold); });
  }

  startSection(id) {
    if (this.timers[id] && this.timers[id].active) return;
    this.timers[id] = { active: true, type: null, hold: null };
    const item = this.data.find((d) => d.id === id);
    this.setState((s) => ({ typed: { ...s.typed, [id]: '' }, visible: { ...s.visible, [id]: true } }));
    let i = 0;
    const typeChar = () => {
      if (!this.timers[id] || !this.timers[id].active) return;
      if (i <= item.text.length) {
        this.setState((s) => ({ typed: { ...s.typed, [id]: item.text.slice(0, i) } }));
        const justTyped = item.text[i - 1];
        let delay = 34 + Math.random() * 20;
        if (justTyped === '.' || justTyped === ',') delay += 550 + Math.random() * 250;
        else if (Math.random() < 0.07) delay += 140;
        i++;
        this.timers[id].type = setTimeout(typeChar, delay);
      } else {
        this.timers[id].hold = setTimeout(() => {
          this.setState((s) => ({ visible: { ...s.visible, [id]: false } }));
        }, 20000);
      }
    };
    this.timers[id].type = setTimeout(typeChar, 400);
  }

  resetSection(id) {
    if (this.timers[id]) {
      clearTimeout(this.timers[id].type);
      clearTimeout(this.timers[id].hold);
      this.timers[id].active = false;
    }
    this.setState((s) => ({ visible: { ...s.visible, [id]: false }, typed: { ...s.typed, [id]: '' } }));
  }

  renderVals() {
    const reels = this.data.map((d) => {
      const meta = this.letterMeta[d.id] || [];
      const letters = d.titleBottom.split('').map((ch, idx) => {
        const key = `${d.id}-${idx}`;
        const hit = !!this.state.letterHits[key];
        const m = meta[idx] || { delay: 0, dur: 6 };
        const style = hit
          ? 'display:inline-block;animation:letterBurst 0.5s ease-out 1;white-space:pre'
          : `display:inline-block;animation:tubeFlicker ${m.dur}s infinite;animation-delay:${m.delay}s;white-space:pre`;
        return { ch: ch === ' ' ? '\u00a0' : ch, style };
      });
      return {
        ...d,
        letters,
        typed: this.state.typed[d.id] || '',
        visible: this.state.visible[d.id] ? 1 : 0,
        scale: this.state.visible[d.id] ? 1 : 0.95
      };
    });
    const activeNote = this.notes.find((n) => n.id === this.state.activeId) || this.notes[0];
    return {
      reels,
      activeNote,
      soundOnStr: String(this.state.soundOn),
      soundLabel: this.state.soundOn ? 'SOUND ON' : 'SOUND OFF',
      dotColor: this.state.soundOn ? '#4ade80' : '#555',
      dotShadow: this.state.soundOn ? '0 0 8px 2px rgba(74,222,128,0.7)' : 'none',
      toggleSound: () => this.setState((s) => ({ soundOn: !s.soundOn })),
      toggleTab: () => this.setState((s) => ({ tabOpen: !s.tabOpen })),
      tabTranslate: this.state.tabOpen ? '0%' : '100%',
      tabButtonRight: this.state.tabOpen ? 'min(33vw, 420px)' : '0px',
      tabArrow: this.state.tabOpen ? '▸' : '◂',
      scrollRef: this.scrollRef,
      onScroll: () => {}
    };
  }
}

</script>
</body>
</html>
